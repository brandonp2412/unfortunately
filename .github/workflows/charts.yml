name: Regenerate charts

on:
  push:
    paths:
      - make_charts.py
      - validate_legacy_review.py
      - .github/workflows/charts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-charts
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check pillow pytest

      - name: Run tests
        run: python3 -m pytest -q

      - name: Regenerate mobile-friendly charts
        run: python3 make_charts.py

      - name: Commit regenerated PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/charts/*.png
          if git diff --cached --quiet; then
            echo "Charts already up to date"
            exit 0
          fi
          git commit -m "Regenerate mobile-friendly charts"
          git pull --rebase origin master
          git push origin HEAD:master
