name: Regenerate canonical outcome summaries and charts

on:
  push:
    paths:
      - build_outcome_summaries.py
      - make_dual_outcome_charts.py
      - make_charts.py
      - output/combined_2010_2019_strict_classification.csv
      - output/combined_2020_2025_binary_classification.csv
      - output/uniform_financial_2010_2025.csv
      - .github/workflows/charts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check pillow pytest

      - name: Run tests
        run: python3 -m pytest -q

      - name: Build canonical summaries
        run: python3 build_outcome_summaries.py

      - name: Regenerate canonical outcome charts
        run: python3 make_dual_outcome_charts.py

      - name: Commit generated outputs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/headline output/charts/legal_*.png output/charts/monetary_*.png output/charts/legal_vs_monetary_*.png
          if git diff --cached --quiet; then
            echo "Canonical outputs already up to date"
            exit 0
          fi
          git commit -m "Regenerate canonical dual-outcome results [skip ci]"
          gh auth setup-git
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
