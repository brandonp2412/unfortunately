name: Regenerate charts

on:
  push:
    paths:
      - make_charts.py
      - output/combined_2020_2025_binary_classification.csv
      - validate_legacy_review.py
      - .github/workflows/charts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-charts
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check pillow pytest

      - name: Run tests
        run: python3 -m pytest -q

      - name: Regenerate charts
        run: python3 make_charts.py

      - name: Commit regenerated PNGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/charts/*.png
          if git diff --cached --quiet; then
            echo "Charts already up to date"
            exit 0
          fi
          git commit -m "Regenerate audited binary charts"
          gh auth setup-git
          git pull --rebase origin master
          git push origin HEAD:master
