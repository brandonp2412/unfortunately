name: Audit unfinished legal cases for source cues

on:
  push:
    paths:
      - audit_legal_source_cues.py
      - analyze_era.py
      - build_outcome_summaries.py
      - output/combined_2020_2025_binary_classification.csv
      - .github/workflows/legal-source-cue-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legal-source-cue-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-cue-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          python3 -m pip install --disable-pip-version-check pillow pytest

      - name: Run tests
        run: python3 -m pytest -q

      - name: Build current unfinished legal work list
        run: python3 build_outcome_summaries.py

      - name: Audit explicit operative source cues
        run: python3 audit_legal_source_cues.py --workers 6

      - name: Commit cue-audit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/legal_source_cue_audit.csv
          if git diff --cached --quiet; then
            echo "Source-cue audit already up to date"
            exit 0
          fi
          git commit -m "Refresh legal source-cue audit [skip ci]"
          gh auth setup-git
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
