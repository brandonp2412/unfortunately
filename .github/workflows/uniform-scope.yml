name: Uniform dismissal-merits scope

on:
  workflow_dispatch:
  push:
    paths:
      - uniform_scope.py
      - combine_uniform_scope.py
      - tests/test_uniform_scope.py
      - .github/workflows/uniform-scope.yml
permissions:
  actions: read
  contents: write
concurrency:
  group: uniform-scope
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check pytest
      - run: python3 -m pytest -q
  scope:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: [2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF extractor
        if: matrix.year >= 2020
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Download legacy acquisition artifact
        if: matrix.year < 2020
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33118434569
          pattern: era-${{ matrix.year }}
          path: .
          merge-multiple: true
      - name: Classify uniform scope
        run: python3 uniform_scope.py --root . --year ${{ matrix.year }} --workers 4
      - uses: actions/upload-artifact@v4
        with:
          name: uniform-scope-${{ matrix.year }}
          path: output/uniform_scope/${{ matrix.year }}.csv
          retention-days: 7
          if-no-files-found: error
  combine:
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: uniform-scope-*
          path: output/uniform_scope
          merge-multiple: true
      - run: python3 combine_uniform_scope.py --root .
      - name: Commit scope outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/uniform_scope/*.csv output/uniform_scope_2010_2025.csv output/uniform_scope_audit_queue.csv output/uniform_scope_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply uniform dismissal-merits scope pass"
          git pull --rebase origin master
          git push origin HEAD:master
