name: Uniform dismissal-merits scope

on:
  workflow_dispatch:
  push:
    paths:
      - uniform_scope.py
      - combine_uniform_scope.py
      - tests/test_uniform_scope.py
      - .github/workflows/uniform-scope.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: uniform-scope
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check pytest
      - run: python3 -m pytest -q

  scope:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: [2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install PDF extractor
        if: matrix.year >= 2020
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Download legacy acquisition artifact
        if: matrix.year < 2020
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33118434569
          pattern: era-${{ matrix.year }}
          path: .
          merge-multiple: true
      - name: Classify uniform scope
        run: python3 uniform_scope.py --root . --year ${{ matrix.year }} --workers 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uniform-scope-${{ matrix.year }}
          path: output/uniform_scope/${{ matrix.year }}.csv
          retention-days: 7
          if-no-files-found: error

  combine:
    needs: scope
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: uniform-scope-*
          path: output/uniform_scope
          merge-multiple: true
      - run: python3 combine_uniform_scope.py --root .
      - name: Commit scope outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/uniform_scope/*.csv output/uniform_scope_2010_2025.csv output/uniform_scope_audit_queue.csv output/uniform_scope_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply uniform dismissal-merits scope pass"
          gh auth setup-git
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
