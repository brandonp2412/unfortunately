name: Resolve financial outcomes

on:
  push:
    paths:
      - resolve_financial_outcomes.py
      - resolve_financial_outcomes_parallel.py
      - apply_financial_audit.py
      - tests/test_resolve_financial_outcomes.py
      - tests/test_apply_financial_audit.py
      - .github/workflows/financial-binary.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: financial-binary
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python3 -m pip install --disable-pip-version-check pytest

      - name: Run tests
        run: python3 -m pytest -q

      - name: Resolve review-routed outcomes from source determinations
        run: python3 resolve_financial_outcomes_parallel.py --root . --workers 8

      - name: Apply source-audited financial resolutions
        run: python3 apply_financial_audit.py --root .

      - name: Audit binary result
        run: |
          python3 - <<'PY'
          import csv
          from collections import Counter

          rows = list(csv.DictReader(open('output/combined_2020_2025_binary_classification.csv', newline='')))
          routed = [r for r in rows if r['financial_tiebreak_applied'] == 'yes']
          assert routed, 'no financial-tiebreak rows were resolved'
          substantive = [r for r in rows if r['classified_outcome'] != 'excluded']
          assert all(r['binary_outcome'] in {'employee_win', 'employer_win'} for r in substantive)
          assert all(r['observable_net_money'] != '' for r in routed)

          audited = [r for r in rows if r.get('financial_audit_status') in {'audited_override', 'audited_confirmed'}]
          assert len(audited) == 15, f'expected 15 source-audited financial cases, got {len(audited)}'

          summary = list(csv.DictReader(open('output/binary_outcome_summary.csv', newline='')))
          assert summary and summary[-1]['year'] == '2020-2025'

          print('rows', len(rows), 'financially-resolved', len(routed))
          print('financially-resolved binary counts', Counter(r['binary_outcome'] for r in routed))
          print('all substantive binary counts', Counter(r['binary_outcome'] for r in substantive))
          print('source-audited rows', len(audited))
          for r in summary:
              print('summary', r)
          PY

      - name: Commit binary classification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            output/combined_2020_2025_binary_classification.csv \
            output/binary_outcome_summary.csv \
            output/financial_audit_resolutions.csv \
            output/financial_review_queue.csv \
            output/financial_audit_high_risk.csv \
            output/financial_outcome_changing_review.csv
          if git diff --cached --quiet; then
            echo "Binary classification already current"
            exit 0
          fi
          git commit -m "Apply audited financial outcome resolutions"
          gh auth setup-git
          git pull --rebase origin master
          git push origin HEAD:master
