name: Acquire legacy ERA review corpus

on:
  push:
    paths:
      - .github/workflows/legacy-acquire.yml
  workflow_dispatch:

concurrency:
  group: legacy-era-acquisition
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019]
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Acquire year
        run: python3 analyze_legacy_year.py --root "years/${{ matrix.year }}" --year "${{ matrix.year }}"

      - name: Stage auditable review inputs
        run: |
          set -euo pipefail
          mkdir -p "artifact/years/${{ matrix.year }}/output"
          cp "years/${{ matrix.year }}/output/initial_extraction.csv" "artifact/years/${{ matrix.year }}/output/"
          cp "years/${{ matrix.year }}/output/${{ matrix.year }}_review_dossier.csv" "artifact/years/${{ matrix.year }}/output/"

      - uses: actions/upload-artifact@v4
        with:
          name: era-${{ matrix.year }}
          path: artifact/
          if-no-files-found: error
          retention-days: 1

  collect:
    needs: acquire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: era-*
          path: .
          merge-multiple: true

      - name: Audit corpus completeness
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          failures = []
          lines = [
              "# Legacy ERA acquisition audit",
              "",
              "These are acquisition/review-queue counts only. They are not legal outcome classifications.",
              "",
              "| Year | Search rows | Unique PDF URLs | Empty/short text rows | Review dossier rows |",
              "|---:|---:|---:|---:|---:|",
          ]
          for year in range(2010, 2020):
              root = Path("years") / str(year)
              initial_path = root / "output" / "initial_extraction.csv"
              dossier_path = root / "output" / f"{year}_review_dossier.csv"
              with initial_path.open(newline="") as f:
                  initial = list(csv.DictReader(f))
              with dossier_path.open(newline="") as f:
                  dossier = list(csv.DictReader(f))
              urls = [row["pdf_url"] for row in initial]
              short = [row for row in dossier if int(row.get("text_chars") or 0) < 1000]
              if len(urls) != len(set(urls)):
                  failures.append(f"{year}: duplicate PDF URLs")
              if len(initial) != len(dossier):
                  failures.append(f"{year}: initial/dossier row count mismatch")
              lines.append(f"| {year} | {len(initial)} | {len(set(urls))} | {len(short)} | {len(dossier)} |")
          Path("LEGACY_ACQUISITION_AUDIT.md").write_text("\n".join(lines) + "\n")
          if failures:
              raise SystemExit("; ".join(failures))
          PY

      - name: Run tests
        run: python3 -m pytest -q

      - name: Commit auditable review inputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEGACY_ACQUISITION_AUDIT.md
          for year in $(seq 2010 2019); do
            git add "years/$year/output/initial_extraction.csv" "years/$year/output/${year}_review_dossier.csv"
          done
          git commit -m "Acquire 2010-2019 ERA review corpus"
          git pull --rebase origin master
          git push origin HEAD:master
